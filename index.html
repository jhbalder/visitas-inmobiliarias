<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitas Inmobiliarias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block">
<style>
/* Layout: navigation rail (desktop) / bottom bar (mobile) + content column; Material 3 light, android.com look. */
:root{
  --bg:#F7F9F5;
  --surface:#FFFFFF;
  --surface-2:#EEF3EC;
  --surface-3:#E2EAE0;
  --ink:#191C19;
  --ink-2:#444944;
  --ink-3:#6F756E;
  --outline:#C5CCC3;
  --android:#3DDC84;
  --android-soft:#C9F5DA;
  --primary:#0A6A3A;
  --blue:#2F5EB8;
  --blue-soft:#DCE6FF;
  --amber:#7A4B00;
  --amber-soft:#FFE2B8;
  --orange:#8F3B00;
  --orange-soft:#FFDCC7;
  --red:#B3261E;
  --red-soft:#FFDAD6;
  --violet:#5B3F9E;
  --violet-soft:#EADDFF;
  --font-display:"Google Sans Flex","Google Sans","Roboto Flex",Roboto,system-ui,sans-serif;
  --font-body:"Google Sans Flex","Google Sans","Roboto Flex",Roboto,system-ui,sans-serif;
  --r-xl:28px; --r-l:20px; --r-m:14px;
  --shadow:0 1px 2px rgba(20,40,25,.08),0 2px 8px rgba(20,40,25,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px);font-weight:650;letter-spacing:-.02em;line-height:1.1}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.ms{font-family:"Material Symbols Rounded";font-weight:450;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";font-variation-settings:"FILL" 0,"opsz" 24;user-select:none;flex:none}
.ms{width:1em;height:1em;overflow:hidden}
.ms.fill{font-variation-settings:"FILL" 1,"opsz" 24}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* App shell */
.app{display:grid;grid-template-columns:104px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0;background:var(--bg)}
.logo{width:52px;height:52px;border-radius:18px;background:var(--android);display:grid;place-items:center;margin-bottom:18px;color:#00210F}
.logo .ms{font-size:30px}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:0;width:80px;color:var(--ink-2);font-size:12px;font-weight:550}
.navbtn .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s;position:relative}
.navbtn:hover .pill{background:var(--surface-3)}
.navbtn[aria-current="page"]{color:var(--ink)}
.navbtn[aria-current="page"] .pill{background:var(--android-soft)}
.navbtn[aria-current="page"] .ms{font-variation-settings:"FILL" 1,"opsz" 24}
.badge-dot{position:absolute;top:0;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.main{min-width:0;padding:0 28px 48px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:16px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.brand{font-family:var(--font-display);font-weight:650;font-size:18px;display:none;align-items:center;gap:8px}
.spacer{flex:1}
.opchip{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 16px;border-radius:22px;border:1px solid var(--outline);background:var(--surface);cursor:pointer;font-weight:600;max-width:100%}
.opchip:hover{background:var(--surface-2)}
.opchip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 14px;border-radius:22px;background:var(--surface);border:1px solid var(--outline);cursor:pointer}
.account:hover{background:var(--surface-2)}
.account .who{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.account .who small{color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.account .who b{font-size:14px;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.av-super{background:var(--ink)!important;box-shadow:0 0 0 2px var(--android)}
.av-broker{background:var(--primary)}.av-asistente{background:var(--blue)}.av-cliente{background:var(--violet)}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin:8px 0 22px}
.page-head .sub{color:var(--ink-2);margin-top:6px;font-size:15px}
.page-head .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:20px;border:0;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .15s,box-shadow .15s}
.btn .ms{font-size:20px}
.btn-filled{background:var(--ink);color:#fff}
.btn-filled:hover{background:#2E332E;box-shadow:var(--shadow)}
.btn-green{background:var(--android);color:#00210F}
.btn-green:hover{background:#34CB78}
.btn-tonal{background:var(--android-soft);color:#00391C}
.btn-tonal:hover{background:#B5EECB}
.btn-outline{background:transparent;border:1px solid var(--outline);color:var(--ink)}
.btn-outline:hover{background:var(--surface-2)}
.btn-text{background:transparent;color:var(--primary);padding:0 12px}
.btn-text:hover{background:var(--surface-2)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#FFC9C3}
.btn-sm{height:34px;padding:0 14px;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn:disabled{opacity:.35;cursor:default;background:transparent}
.fab{position:fixed;right:28px;bottom:28px;z-index:30;height:64px;padding:0 24px 0 20px;border-radius:20px;background:var(--android);color:#00210F;border:0;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;box-shadow:0 4px 14px rgba(10,106,58,.25),0 1px 3px rgba(0,0,0,.12)}
.fab:hover{background:#34CB78}
.fab .ms{font-size:26px}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--outline);background:var(--surface);cursor:pointer;font-weight:550;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.fchip:hover{background:var(--surface-2)}
.fchip[aria-pressed="true"]{background:var(--android-soft);border-color:transparent;color:#00391C}
.fchip .n{font-variant-numeric:tabular-nums;opacity:.75}
.status{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:650;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-nueva{background:var(--blue-soft);color:var(--blue)}
.s-leida{background:var(--surface-3);color:var(--ink-2)}
.s-para_agendar{background:var(--android-soft);color:var(--primary)}
.s-por_visitar{background:var(--violet-soft);color:var(--violet)}
.s-oferta{background:var(--amber-soft);color:var(--amber)}
.s-negociacion{background:var(--orange-soft);color:var(--orange)}
.s-reservada{background:#0A6A3A;color:#fff}
.s-escritura{background:#123B6D;color:#fff}
.s-descartada{background:var(--surface-3);color:var(--ink-3)}
.s-pendiente{background:var(--amber-soft);color:var(--amber)}
.s-rechazada{background:var(--red-soft);color:var(--red)}
.s-propuesta{background:var(--amber-soft);color:var(--amber)}
.s-confirmada{background:var(--android-soft);color:var(--primary)}

/* Summary strip */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border-radius:var(--r-l);padding:16px 18px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent}
.stat b{font-family:var(--font-display);font-size:30px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--ink-2);font-size:13px;font-weight:550}
.stat.click{cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat.click:hover{border-color:var(--outline)}
.stat.alert{background:var(--amber-soft)}
.stat.alert span{color:var(--amber)}

/* Properties */
.props-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.pcard{background:var(--surface);border-radius:var(--r-xl);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(20,40,25,.12)}
.pimg{position:relative;aspect-ratio:16/10;background:var(--surface-2)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .tl{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.pimg .tl .status{box-shadow:0 1px 3px rgba(0,0,0,.15)}
.rankbadge{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:13px;background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:700;display:grid;place-items:center;font-size:15px}
.portal{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;color:var(--ink-2)}
.photo-count{position:absolute;right:12px;bottom:12px;background:rgba(25,28,25,.7);color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:600;display:flex;gap:4px;align-items:center}
.photo-count .ms{font-size:14px}
.pbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font-family:var(--font-display);font-size:22px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.exp{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.loc{display:flex;align-items:center;gap:4px;color:var(--ink-2);font-size:13px}
.loc .ms{font-size:17px}
.specs{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--ink-2);font-size:13px;margin-top:4px}
.specs span{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.specs .ms{font-size:17px;color:var(--ink-3)}
.pactions{display:flex;gap:8px;margin-top:auto;padding-top:12px;flex-wrap:wrap;align-items:center}
.card-tools{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;margin:2px -8px -8px}
.card-tools .left{display:flex;gap:2px}
.card-tools .icon-btn{color:var(--ink-3);text-decoration:none}
.card-tools .icon-btn.wa{color:#1DA851}
.card-tools .icon-btn.wa:hover{background:#DCF8E6;color:#128C3E}
.card-tools .icon-btn.ok:hover{background:var(--android-soft);color:var(--primary)}
.card-tools .icon-btn.ok.is-on{color:var(--primary)}
.card-tools .icon-btn.ok.is-on:hover{background:var(--amber-soft);color:var(--amber)}
.card-tools .icon-btn.cal:hover{background:var(--android-soft);color:var(--primary)}
.card-tools .icon-btn.cal.is-off{opacity:.38}
.srcph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;background:var(--android-soft);color:var(--primary);padding:16px}
.srcph .ms{font-size:34px}.srcph small{color:var(--ink-2)}
.pcard.linkonly .srcdetail{align-self:flex-start;margin:4px 0 0 -8px}
.card-tools .icon-btn.cal.is-off:hover{background:transparent;color:var(--ink-3)}
.card-tools .icon-btn.del-card:hover{background:var(--red-soft);color:var(--red)}
.vpick{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:var(--surface-2);border-radius:16px;padding:10px}
.vpick img{width:72px;height:54px;border-radius:10px;object-fit:cover;display:block}
.vpick b{display:block;font-weight:600}
.vpick small{color:var(--ink-3);font-variant-numeric:tabular-nums}



.panel{background:var(--surface);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow)}
.panel h2{margin-bottom:4px}
.panel .hint{color:var(--ink-3);font-size:13px;margin:0 0 14px}
.rank-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank-item{display:grid;grid-template-columns:30px 56px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:16px;background:var(--surface-2)}
.rank-item .no{font-family:var(--font-display);font-weight:700;font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.rank-item img{width:56px;height:44px;border-radius:10px;object-fit:cover;display:block}
.rank-item .t{min-width:0}
.rank-item .t b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-item .t small{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.rank-item .mv{display:flex}
.rank-item .mv .icon-btn{width:32px;height:32px}
.rank-item .mv .ms{font-size:20px}
.empty{padding:28px;text-align:center;color:var(--ink-3);background:var(--surface);border-radius:var(--r-xl);border:1px dashed var(--outline)}
.empty .ms{font-size:36px;display:block;margin:0 auto 8px;color:var(--outline)}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
.section-title .count{color:var(--ink-3);font-weight:600;font-size:14px}
details.discarded summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;margin:26px 0 14px;font-family:var(--font-display);font-weight:600;font-size:18px}
details.discarded summary::-webkit-details-marker{display:none}
details.discarded[open] summary .ms{transform:rotate(90deg)}
.pcard.dim .pimg{opacity:.6;filter:grayscale(.5)}
.pcard.dim .price,.pcard.dim h3{color:var(--ink-2)}

/* Agenda */
.pref-banner{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--android-soft);border-radius:var(--r-l);padding:14px 18px;margin-bottom:18px;color:#00391C}
.pref-banner b{font-weight:650}
.pref-banner .slot{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.6);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.weeknav{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.weeknav h2{margin-left:6px;font-size:18px}
.legend{display:flex;gap:14px;margin-left:auto;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.week-scroll{overflow-x:auto;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:8px 8px 12px}
.week{min-width:820px}
.wk-head{display:grid;grid-template-columns:52px repeat(7,1fr);padding:6px 0 8px}
.wk-head div{text-align:center;font-size:12px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.wk-head div b{display:block;font-family:var(--font-display);font-size:22px;color:var(--ink);font-weight:550;letter-spacing:0;margin:2px auto 0;width:40px;height:40px;line-height:40px;border-radius:50%;font-variant-numeric:tabular-nums}
.wk-head div.today b{background:var(--ink);color:#fff}
.wk-body{display:grid;grid-template-columns:52px repeat(7,1fr);position:relative}
.wk-times{position:relative}
.wk-times span{position:absolute;right:8px;font-size:11px;color:var(--ink-3);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wk-day{position:relative;border-left:1px solid var(--surface-3);background-image:repeating-linear-gradient(to bottom,var(--surface-3) 0,var(--surface-3) 1px,transparent 1px,transparent var(--rowh))}
.wk-day.today{background-color:#FAFDF9}
.pref-band{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(61,220,132,.16) 0 6px,rgba(61,220,132,.08) 6px 12px);border-left:3px solid var(--android)}
.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:4px 8px;font-size:11px;line-height:1.2;overflow:hidden;cursor:pointer;border:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.ev b{font-weight:650;font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{font-variant-numeric:tabular-nums;opacity:.85}
.ev.confirmada{background:var(--primary);color:#fff}
.ev.propuesta{background:#FFF6E8;color:var(--amber);border:1.5px dashed #D99A3A}
.ev.done{background:var(--surface-3);color:var(--ink-2)}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}
.now-line::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.visit-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:22px;align-items:start}
.vcard{background:var(--surface);border-radius:var(--r-l);padding:14px;display:grid;grid-template-columns:64px 1fr;gap:12px;box-shadow:var(--shadow)}
.vdate{background:var(--surface-2);border-radius:14px;text-align:center;padding:8px 4px;display:flex;flex-direction:column;justify-content:center}
.vdate small{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.vdate b{font-family:var(--font-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.vdate span{font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.vcard .vt{display:flex;flex-direction:column;gap:4px;min-width:0}
.vcard .vt h3{font-size:14px}
.vcard .vt .addr{font-size:13px;color:var(--ink-2)}
.vcard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.warn{display:flex;gap:6px;align-items:flex-start;color:var(--amber);font-size:12px;font-weight:600}
.warn .ms{font-size:16px}
.result{background:var(--surface-2);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--ink-2)}
.col-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.col-title .count{color:var(--ink-3);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}

/* Pipeline */
.board-scroll{overflow-x:auto;padding-bottom:12px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;min-width:min-content}
.bcol{background:var(--surface-2);border-radius:var(--r-l);padding:12px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.bcol header{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.bcol header .n{font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bcard{background:var(--surface);border-radius:16px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.bcard:hover{box-shadow:0 4px 14px rgba(20,40,25,.12)}
.bcard .top{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center}
.bcard img{width:48px;height:40px;border-radius:9px;object-fit:cover;display:block}
.bcard b{font-size:13px;font-weight:600;display:block;line-height:1.25}
.bcard small{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

<script>
(function(){
"use strict";
const KEY = "visitas-inmo-v2";
const TZ = "America/Argentina/Buenos_Aires";
const DAYS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const ROLES = {
  broker:{label:"Broker",icon:"verified_user",desc:"Aprueba propiedades y visitas"},
  asistente:{label:"Asistente",icon:"support_agent",desc:"Carga propiedades y arma la agenda"},
  cliente:{label:"Cliente",icon:"person",desc:"Prioriza y agenda sus visitas"}
};
const ROLE_INFO = Object.assign({}, ROLES, { colaborador:{label:"Broker invitado",icon:"handshake",desc:"Trabaja una operación puntual como broker"}, broker_env:{label:"Broker",icon:"verified_user",desc:"Broker del ambiente"} });
const STATUS = {
  nueva:{label:"Nueva", col:"Nuevas"}, leida:{label:"Leída", col:"Leídas"}, para_agendar:{label:"Agendar visita", col:"Agendar visita"}, por_visitar:{label:"Por visitar", col:"Por visitar"},
  oferta:{label:"Oferta", col:"Oferta"}, negociacion:{label:"En negociación", col:"En negociación"}, reservada:{label:"Reservada", col:"Reservada"}, escritura:{label:"Firma de escritura", col:"Firma de escritura"}, descartada:{label:"Descartada", col:"Descartadas"}
};
const STATUS_KEYS = Object.keys(STATUS);
// El cliente pidió verla («Quiero verla»): recién ahí se puede agendar.
// Seguimiento: Nueva -> Leída (el cliente la abrió) -> Para agendar («Quiero verla») -> Por visitar -> ...
const wanted = p => !!p && p.approval==="aprobada" && !["nueva","leida","descartada"].includes(p.status);
// Datos anteriores: «leída con prioridad» significaba que el cliente quería verla.
function migrateOp(o){ (o && o.props || []).forEach(p => { if (p.status==="leida" && p.rank!=null) p.status = "para_agendar"; }); return o; }
function markRead(p){
  if (!p || isStaff() || p.status!=="nueva" || p.approval!=="aprobada") return false;
  p.status = "leida"; logp(p, `${S.session.name} la vio`); return true;
}
const RATING = {
  encanto:{label:"Me encantó",icon:"favorite"},
  interesante:{label:"Interesante",icon:"thumb_up"},
  no:{label:"No me convenció",icon:"thumb_down"}
};
const BARRIOS = ["palermo","belgrano","nunez","colegiales","villa-crespo","caballito","recoleta","almagro","coghlan","saavedra","villa-urquiza","chacarita","san-telmo","barrio-norte","retiro","puerto-madero","flores","villa-devoto","olivos","vicente-lopez","martinez","san-isidro","villa-ortuzar","parque-chas","boedo","balvanera","monserrat","nordelta","tigre"];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => (p||"id") + Math.random().toString(36).slice(2,9);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const fromMin = m => pad(Math.floor(m/60))+":"+pad(m%60);
const fmtNum = n => (n==null||n==="") ? "—" : Number(n).toLocaleString("es-AR");
const usd = n => (n==null||n==="") ? "—" : "USD " + fmtNum(n);
const ars = n => (n==null||n==="") ? "—" : "$ " + fmtNum(n);
const fmtDateShort = s => { const d = parseYmd(s); return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; };
const fmtDateLong = s => { const d = parseYmd(s); return DAYS_LONG[d.getDay()]+" "+d.getDate()+" de "+MONTHS[d.getMonth()]; };
const nowStamp = () => { const d = new Date(); return ymd(d); };
const initials = n => (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const kb = b => b>1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";

function placeholder(seed){
  const pals = [["#D7F5E3","#3DDC84","#0A6A3A","#F3FBF6"],["#DCE6FF","#7FA7F5","#2F5EB8","#F4F7FF"],["#FFE9C9","#F5B14C","#7A4B00","#FFF8EE"],["#EADDFF","#B69DF8","#5B3F9E","#F8F4FF"],["#FFDCE6","#F28BAE","#7D2948","#FFF5F8"],["#D3F1F1","#5CC8C8","#0D5C5C","#F2FBFB"]];
  let h=0; for (const c of String(seed)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const p = pals[h % pals.length];
  const floors = 4 + (h % 5), bw = 150, bx = 70 + (h % 60), fh = 26;

  let win = "";
  for (let f=0; f<floors; f++) for (let c=0;c<4;c++){

function parseListing(url){

/* ---------- autocompletado de direcciones (Google Maps) ---------- */
let placesTimer = null, placesSeq = 0;
function placesClose(){ document.querySelectorAll(".places-list").forEach(x=>x.remove()); }
function placesSuggest(input){
  clearTimeout(placesTimer);
  const q = input.value.trim();
  if (UI.server !== true || q.length < 3){ placesClose(); return; }
  placesTimer = setTimeout(async () => {
    const seq = ++placesSeq;
    let d; try { d = await api("/lugares?q=" + encodeURIComponent(q + (input.id==="f-address" && $("#f-barrio") && $("#f-barrio").value ? ", " + $("#f-barrio").value : ""))); } catch(err){ return; }
    if (seq !== placesSeq || document.activeElement !== input) return;
    placesClose();
    if (!d.items || !d.items.length) return;
    const box = document.createElement("div");
    box.className = "places-list"; box.setAttribute("role","listbox");
    box.innerHTML = d.items.map((it,i)=>`<button type="button" role="option" data-i="${i}"><span class="ms">location_on</span><span><b>${esc(it.main)}</b><small>${esc(it.secondary||"")}</small></span></button>`).join("") + `<div class="places-src">${d.source==="google"?"Sugerencias de Google Maps":"Sugerencias de OpenStreetMap"}</div>`;
    box.addEventListener("mousedown", ev => ev.preventDefault()); // no saca el foco del campo
    box.addEventListener("click", ev => {
      const b = ev.target.closest("button[data-i]"); if (!b) return;
      const it = d.items[+b.dataset.i];
      input.dataset.filling = "1";
      if (input.id === "f-address"){
        input.value = it.main;
        const loc = $("#f-barrio"); if (loc && it.secondary) loc.value = it.secondary;
      } else {
        input.value = it.full || [it.main, it.secondary].filter(Boolean).join(", ");
        const m = $("#v-map"); if (m) m.href = mapsUrl(input.value);
      }
      delete input.dataset.filling;
      input.classList.add("filled"); placesClose(); input.focus();
    });
    input.parentElement.style.position = "relative";
    input.insertAdjacentElement("afterend", box);
    box.style.top = (input.offsetTop + input.offsetHeight + 4) + "px";
  }, 300);
}
document.addEventListener("focusout", e => { if (["f-address","v-addr","d-deed-addr"].includes(e.target.id)) setTimeout(placesClose, 150); });
document.addEventListener("keydown", e => { if (e.key==="Escape" && document.querySelector(".places-list")){ e.preventDefault(); e.stopPropagation(); placesClose(); } }, true);

function applySearch(){
  const q = normQ(UI.search), words = q ? q.split(" ") : [];
  const cards = [...document.querySelectorAll("#root article.pcard")];
  let shown = 0;
  for (const c of cards){ const ok = !words.length || words.every(w => (c.dataset.search||"").includes(w)); c.hidden = !ok; if (ok) shown++; }
  document.querySelectorAll("#root .grid").forEach(g => { const any = [...g.children].some(x => !x.hidden); g.hidden = !any; const h = g.previousElementSibling; if (h && h.classList.contains("section-title")) h.hidden = !any; });
  const em = document.getElementById("search-empty"); if (em){ em.hidden = !(words.length && cards.length && !shown); const sq = document.getElementById("search-q"); if (sq) sq.textContent = UI.search; }

  const counts = {todas:o.props.length, pendiente:o.props.filter(p=>p.approval==="pendiente").length, aprobada:o.props.filter(p=>p.approval==="aprobada"&&p.status!=="descartada").length, rechazada:o.props.filter(p=>p.approval==="rechazada").length, descartada:o.props.filter(p=>p.approval==="aprobada"&&p.status==="descartada").length};
  const f = UI.propFilter;
  let list = o.props.filter(p => f==="todas" || (f==="descartada" ? p.approval==="aprobada" && p.status==="descartada" : f==="aprobada" ? p.approval==="aprobada" && p.status!=="descartada" : p.approval===f));
  list.sort((a,b)=>{
    const w = p => p.approval==="pendiente"?0:p.approval==="rechazada"?3:p.status==="descartada"?2:1;
    return w(a)-w(b) || (a.rank??99)-(b.rank??99);
  });
  const offers = o.props.filter(p=>["oferta","negociacion","reservada"].includes(p.status)).length;
  const conf = o.visits.filter(v=>v.state==="confirmada" && parseYmd(v.date)>=today()).length;
  return `
  <div class="page-head"><div><h1>Propiedades</h1><div class="sub">${esc(o.name)} · ${o.clients.length ? `${o.clients.length} ${o.clients.length===1?"cliente":"clientes"}: ${esc(clientLabel())}` : "Todavía sin clientes. Sumalos desde Operación."}</div></div></div>
  <div class="summary">
    <div class="stat ${counts.pendiente?'alert':''}"><b>${counts.pendiente}</b><span>${isBroker()?"Esperan tu aprobación":"Esperan aprobación del broker"}</span></div>
    <div class="stat"><b>${o.props.filter(p=>p.approval==="aprobada"&&p.status==="nueva").length}</b><span>Sin revisar por el cliente</span></div>
    <div class="stat"><b>${conf}</b><span>Visitas confirmadas</span></div>
    <div class="stat"><b>${offers}</b><span>En oferta o reserva</span></div>
  </div>
  <div class="props-layout">
    <div>
      ${searchBarHTML()}
      <div class="chips" role="group" aria-label="Filtrar" style="margin-bottom:16px">
        ${[["todas","Todas"],["pendiente","Por aprobar"],["aprobada","Aprobadas"],["rechazada","No aprobadas"],["descartada","Descartadas por el cliente"]].map(([k,l])=>`<button class="fchip" data-action="pfilter" data-f="${k}" aria-pressed="${f===k}">${f===k?'<span class="ms" style="font-size:18px">check</span>':""}${l} <span class="n">${counts[k]}</span></button>`).join("")}
      </div>
      ${list.length?`<div class="grid">${list.map(p=>propCard(p,{dim:p.status==="descartada"||p.approval==="rechazada"})).join("")}</div>`:`<div class="empty"><span class="ms">add_home</span>No hay propiedades en este filtro. Pegá el link de un aviso para sumar la primera.</div>`}
    </div>
    <aside class="panel"><h2>Prioridades ${o.clients.length?"de "+esc(clientLabel()):"del cliente"}</h2><p class="hint">Orden que definió el cliente. Usalo para decidir qué visitas coordinar primero.</p>${rankListHTML(false)}</aside>
  </div>`;
}

/* ---------- agenda ---------- */
const H0 = 8, H1 = 21, ROWH = 52;
function agendaHTML(){
  const o = op();
  if (!UI.weekStart) UI.weekStart = ymd(weekMonday(today()));
  const ws = parseYmd(UI.weekStart);
  const days = [...Array(7)].map((_,i)=>addDays(ws,i));
  const tStr = ymd(today());
  const staff = isStaff();
  const vis = o.visits.filter(v => v.state!=="rechazada" && (staff || v.state==="confirmada"));
  const slots = o.clients.flatMap(c=>c.slots||[]);
  const now = new Date();
  const endW = addDays(ws,6);
  const title = ws.getMonth()===endW.getMonth() ? `${ws.getDate()} al ${endW.getDate()} de ${MONTHS[ws.getMonth()]}` : `${ws.getDate()} ${MONTHS[ws.getMonth()]} al ${endW.getDate()} ${MONTHS[endW.getMonth()]}`;
  const dayCol = d => {
    const ds = ymd(d), wd = d.getDay();
    const bands = slots.filter(s=>s.days.includes(wd)).map(s=>{
      const a = Math.max(toMin(s.from), H0*60), b = Math.min(toMin(s.to), H1*60);
      if (b<=a) return "";
      return `<div class="pref-band" style="top:${(a-H0*60)/60*ROWH}px;height:${(b-a)/60*ROWH}px" title="Disponibilidad del cliente ${s.from}–${s.to}"></div>`;
    }).join("");
    const evs = vis.filter(v=>v.date===ds).map(v=>{
      const p = prop(v.propId); if (!p) return "";
      const s = toMin(v.time), dur = v.duration||45;
      const past = parseYmd(v.date) < today();
      const cls = past ? "done" : v.state;
      return `<button class="ev ${cls}" style="top:${(s-H0*60)/60*ROWH+1}px;height:${Math.max(dur/60*ROWH-2,30)}px" data-action="open-visit" data-id="${v.id}"><b>${esc(p.title)}</b><small>${v.time} · ${esc(p.address || p.barrio || "")}</small></button>`;
    }).join("");
    let nowLine = "";
    if (ds===tStr){ const m = now.getHours()*60+now.getMinutes(); if (m>=H0*60 && m<=H1*60) nowLine = `<div class="now-line" style="top:${(m-H0*60)/60*ROWH}px"></div>`; }
    return `<div class="wk-day ${ds===tStr?'today':''}" style="height:${(H1-H0)*ROWH}px">${bands}${evs}${nowLine}</div>`;
  };
  const sorted = [...o.visits].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const upcoming = sorted.filter(v=>parseYmd(v.date)>=today());
  const pending = upcoming.filter(v=>v.state==="propuesta");
  const confirmed = upcoming.filter(v=>v.state==="confirmada");
  const done = sorted.filter(v=>parseYmd(v.date)<today() && v.state==="confirmada").reverse();
  const rejected = upcoming.filter(v=>v.state==="rechazada" && v.rejectedBy!=="cliente");
  const rejectedClient = upcoming.filter(v=>v.state==="rechazada" && v.rejectedBy==="cliente");
  const newNotices = staff ? unread() : [];
  const col = (t, icon, arr, emptyTxt) => `<section><div class="col-title"><span class="ms">${icon}</span><h2>${t}</h2><span class="count num">${arr.length}</span></div>${arr.length?`<div class="stack">${arr.map(visitCard).join("")}</div>`:`<div class="empty" style="padding:20px">${emptyTxt}</div>`}</section>`;
  return `
  <div class="page-head"><div><h1>Agenda de visitas</h1><div class="sub">${staff?"Proponé horarios dentro de la disponibilidad del cliente. El broker confirma si puede acompañar.":"Estas son tus visitas confirmadas. Agregalas a tu Google Calendar con un toque."}</div></div></div>
  ${newNotices.map(n=>`<div class="notice" role="alert"><span class="ms fill">event_busy</span><div class="txt"><b>${esc(n.text)}</b>${n.reason?`<small>Motivo: ${esc(n.reason)}</small>`:""}<small>${fmtDateShort(n.date)}</small></div><div class="acts">${n.visitId && op().visits.some(v=>v.id===n.visitId && v.state==="rechazada")?`<button class="btn btn-filled btn-sm" data-action="edit-visit" data-id="${n.visitId}" data-notice="${n.id}"><span class="ms">edit_calendar</span>Reprogramar</button>`:""}<button class="btn btn-text btn-sm" data-action="notice-read" data-id="${n.id}">Entendido</button></div></div>`).join("")}
  <div class="pref-banner"><span class="ms">schedule</span>${o.clients.map(c=>`<b>${esc(c.name)}</b> ${(c.slots||[]).map(s=>`<span class="slot">${esc(slotText(s))}</span>`).join(" ")||'<span class="slot">Sin horarios cargados</span>'}`).join(" &nbsp; ")}
    ${!staff?`<button class="btn btn-text btn-sm" data-action="edit-prefs" style="margin-left:auto">Cambiar mis horarios</button>`:""}</div>
  <div class="weeknav">
    <button class="icon-btn" data-action="week" data-d="-7" aria-label="Semana anterior"><span class="ms">chevron_left</span></button>
    <button class="icon-btn" data-action="week" data-d="7" aria-label="Semana siguiente"><span class="ms">chevron_right</span></button>
    <button class="btn btn-outline btn-sm" data-action="week" data-d="0">Hoy</button>
    <h2>${title}</h2>
    <div class="legend"><span><i style="background:var(--primary)"></i>Confirmada</span>${staff?`<span><i style="background:#FFF6E8;border:1.5px dashed #D99A3A"></i>Propuesta, espera al broker</span>`:""}<span><i style="background:rgba(61,220,132,.25);border-left:3px solid var(--android)"></i>Disponibilidad del cliente</span></div>
  </div>
  <div class="week-scroll"><div class="week" style="--rowh:${ROWH}px">
    <div class="wk-head"><div></div>${days.map(d=>`<div class="${ymd(d)===tStr?'today':''}">${DAYS[d.getDay()]}<b>${d.getDate()}</b></div>`).join("")}</div>
    <div class="wk-body">
      <div class="wk-times" style="height:${(H1-H0)*ROWH}px">${[...Array(H1-H0)].map((_,i)=> i===0?"":`<span style="top:${i*ROWH}px">${pad(H0+i)}:00</span>`).join("")}</div>
      ${days.map(dayCol).join("")}
    </div>
  </div></div>
  <div class="visit-cols">
    ${staff ? col(isBroker()?"Esperan tu confirmación":"Esperan confirmación del broker","pending_actions",pending,"No hay visitas propuestas.") : ""}
    ${col("Próximas confirmadas","event_available",confirmed, staff?"Todavía no hay visitas confirmadas.":"Tu broker te va a avisar cuando confirme una visita.")}
    ${col("Realizadas","history",done,"Cuando hagas una visita vas a poder registrar qué te pareció.")}
    ${staff && rejectedClient.length ? col("El cliente no puede ir","person_cancel",rejectedClient,"") : ""}
    ${staff && rejected.length ? col("Rechazadas por el broker","event_busy",rejected,"") : ""}
  </div>`;
}
function visitCard(v){
  const p = prop(v.propId); if (!p) return "";
  const d = parseYmd(v.date);
  const past = d < today();
  const staff = isStaff();
  const out = !inPrefs(v.date, v.time, v.duration);
  let actions = "";
  if (v.state==="propuesta" && isBroker()) actions += `<button class="btn btn-filled btn-sm" data-action="confirm-visit" data-id="${v.id}"><span class="ms">check</span>Confirmar</button><button class="btn btn-text btn-sm" data-action="reject-visit" data-id="${v.id}">No puedo</button>`;
  if (v.state==="confirmada" && !past) actions += `<a class="btn btn-tonal btn-sm" href="${gcalUrl(v,p)}" target="_blank" rel="noopener"><span class="ms">event</span>Google Calendar</a>`;
  if (v.state==="confirmada" && !past && !staff) actions += `<button class="btn btn-text btn-sm" data-action="client-reject" data-id="${v.id}" style="color:var(--red)"><span class="ms">event_busy</span>No puedo ir</button>`;
  if (past && v.state==="confirmada") actions += `<button class="btn ${v.result?'btn-text':'btn-tonal'} btn-sm" data-action="result" data-id="${v.id}"><span class="ms">rate_review</span>${v.result?"Editar resultado":"Registrar resultado"}</button>`;
  if (staff && !past && v.state==="rechazada") actions += `<button class="btn btn-tonal btn-sm" data-action="edit-visit" data-id="${v.id}"><span class="ms">edit_calendar</span>Reprogramar</button>`;
  else if (staff && !past) actions += `<button class="icon-btn" data-action="edit-visit" data-id="${v.id}" aria-label="Editar visita"><span class="ms">edit</span></button>`;
  return `<article class="vcard">
    <div class="vdate"><small>${DAYS[d.getDay()]}</small><b>${d.getDate()}</b><span>${v.time}</span></div>
    <div class="vt">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="status s-${v.state==="rechazada"&&v.rejectedBy==="cliente"?"rechazada_cliente":v.state}">${v.state==="propuesta"?"Propuesta":v.state==="confirmada"?(past?"Realizada":"Confirmada"):v.rejectedBy==="cliente"?"El cliente no puede":"Rechazada"}</span><small class="num" style="color:var(--ink-3)">${v.duration||45} min</small></div>
      <h3><button data-action="open" data-id="${p.id}" style="all:unset;cursor:pointer">${esc(p.title)}</button></h3>
      ${v.address && v.address.trim() ? "" : `<small style="color:var(--ink-2)">${esc(addrOf(p))}</small>`}
      <a class="addr" href="${mapsUrl(v.address)}" target="_blank" rel="noopener" style="color:var(--ink-2)">${esc(v.address)}</a>
      ${staff && out && v.state!=="rechazada" && !past ? `<div class="warn"><span class="ms">warning</span>Fuera de los horarios que indicó el cliente</div>`:""}
      ${v.state==="rechazada"&&v.rejectedBy==="cliente"&&staff?`<div class="result"><b>${esc(v.rejectedName||"El cliente")}</b>${v.clientReason?": "+esc(v.clientReason):" no indicó motivo"}</div>`:""}
      ${v.result?`<div class="result"><b>${RATING[v.result.rating]?.label||""}</b>${v.result.note?" · "+esc(v.result.note):""}</div>`:""}
      ${actions?`<div class="row">${actions}</div>`:""}
    </div>
  </article>`;
}

/* ---------- pipeline ---------- */
function pipelineHTML(){
  const o = op();
  const staff = isStaff();
  const cols = [];
  if (staff) cols.push({k:"pendiente",label:"Por aprobar",items:o.props.filter(p=>p.approval==="pendiente")});
  STATUS_KEYS.forEach(k=> cols.push({k, label:STATUS[k].col||STATUS[k].label, items:o.props.filter(p=>p.approval==="aprobada" && p.status===k).sort((a,b)=>(a.rank??99)-(b.rank??99))}));
  const card = p => {
    let extra = "";
    if (p.status==="oferta" || p.status==="negociacion") extra += `<dl class="kv"><dt>Ofrecido</dt><dd>${usd(p.offer.price)}</dd><dt>Depósito</dt><dd>${usd(p.offer.deposit)}</dd>${p.status==="negociacion"?`<dt>Contraoferta</dt><dd>${usd(p.nego.counter)}</dd>`:""}</dl>`;
    if (p.status==="escritura"){ const d = deedOf(p); extra += `<dl class="kv"><dt>Firma</dt><dd>${d.date?fmtDateShort(d.date)+(d.time?" "+d.time:""):"—"}</dd><dt>Lugar</dt><dd>${esc(d.place||d.address||"—")}</dd></dl>`; }
    if (p.status==="reservada") extra += `<dl class="kv"><dt>Avance</dt><dd>${p.reserve.progress||0}%</dd></dl><div class="progress"><i style="width:${p.reserve.progress||0}%"></i></div>`;
    if (p.status==="descartada" && p.choiceNote) extra += `<small>${esc(p.choiceNote)}</small>`;
    const docs = DOC_KINDS.reduce((n,k)=>n+docArr(p,k).length,0);
    return `<button class="bcard" data-action="open" data-id="${p.id}"><div class="top"><img referrerpolicy="no-referrer" src="${cover(p)}" alt=""><div><b>${esc(p.title)}</b><small class="addr-line">${esc(addrOf(p))}</small><small style="display:block">${usd(p.price)}</small></div></div>${p.rank&&!["nueva","leida","descartada"].includes(p.status)?`<small>Prioridad #${p.rank}</small>`:""}${extra}${docs?`<small><span class="ms" style="font-size:14px;vertical-align:-2px">attach_file</span> ${docs} ${docs===1?"documento":"documentos"}</small>`:""}</button>`;
  };
  return `
  <div class="page-head"><div><h1>Seguimiento</h1><div class="sub">Cada propiedad avanza de Nueva a Firma de escritura. ${staff?"Abrí una tarjeta para cargar ofertas, contraofertas, documentos y novedades.":"Acá ves en qué etapa está cada propiedad."}</div></div></div>
  <div class="board-scroll"><div class="board">
    ${cols.map(c=>`<section class="bcol"><header><span class="status s-${c.k}">${c.label}</span><span class="n">${c.items.length}</span></header>${c.items.map(card).join("")||`<small style="color:var(--ink-3);padding:4px">Sin propiedades</small>`}</section>`).join("")}
  </div></div>`;
}

/* ---------- dialogs ---------- */
const dlg = $("#dlg");
function openDlg(html, wide){ dlg.className = wide ? "wide" : ""; dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); const f = dlg.querySelector("[autofocus]"); if (f) f.focus(); }
function closeDlg(){ if (dlg.open) dlg.close(); UI.confirmDelete = null; }
// Se cierra solo si el clic empezó y terminó afuera del cuadro (seleccionar texto arrastrando hacia afuera no lo cierra).
let dlgDownOutside = false;
dlg.addEventListener("mousedown", e => { dlgDownOutside = e.target === dlg && outsideBox(e); });
dlg.addEventListener("click", e => { const ok = dlgDownOutside && e.target === dlg && outsideBox(e); dlgDownOutside = false; if (ok) closeDlg(); });
function outsideBox(e){ const box = dlg.firstElementChild; if (!box) return true; const r = box.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; }

function captureImport(){

    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- etapas: documentos y datos de cada estado ---------- */
const DOC_KINDS = ["offer","nego_receipt","nego","res_signed","res_receipt"];
const DOC_INFO = {
  offer:{label:"Documentos de la oferta"},
  nego_receipt:{label:"Recibo del adelanto", req:true},
  nego:{label:"Otros documentos de la oferta"},
  res_signed:{label:"Oferta final firmada", req:true},
  res_receipt:{label:"Recibo del dinero", req:true}
};
function docArr(p, kind){
  p.offer = p.offer || {price:"",deposit:"",docs:[]}; p.nego = p.nego || {counter:"",docs:[]};
  p.reserve = p.reserve || {progress:0,notary:false,costs:"",commission:"",news:[]};
  const where = {offer:[p.offer,"docs"], nego:[p.nego,"docs"], nego_receipt:[p.nego,"receipt"], res_signed:[p.reserve,"signed"], res_receipt:[p.reserve,"receipt"]}[kind];
  if (!where) return [];
  const [obj, key] = where; if (!Array.isArray(obj[key])) obj[key] = [];
  return obj[key];
}
function deedOf(p){ if (!p.deed) p.deed = { place:"", address:"", date: (p.reserve && p.reserve.deedDate) || "", time:"", notes:"" }; return p.deed; }
// Lo que falta para pasar a una etapa (vacío = se puede)
function stageMissing(p, st){
  const miss = [];
  if (st==="negociacion" && !docArr(p,"nego_receipt").length) miss.push("subir el recibo del adelanto");
  if (st==="reservada"){ if (!docArr(p,"res_signed").length) miss.push("subir la oferta final firmada"); if (!docArr(p,"res_receipt").length) miss.push("subir el recibo del dinero"); }
  if (st==="escritura"){ const d = deedOf(p); if (!(d.place||d.address)) miss.push("cargar el lugar de la firma"); if (!d.date) miss.push("cargar la fecha de la firma"); }
  return miss;
}
function docsHTML(p, kind, editable){
  const arr = docArr(p, kind), info = DOC_INFO[kind];
  return `<div class="field"><label>${info.label}${info.req?' <span class="req">obligatorio</span>':""}</label><ul class="doclist">${arr.map((d,i)=>`<li><span class="ms" style="font-size:18px;color:var(--ink-3)">description</span>${d.url?`<button type="button" class="t doc-open" data-action="open-doc" data-url="${esc(d.url)}" data-name="${esc(d.name)}">${esc(d.name)}</button>`:`<span class="t">${esc(d.name)}</span>`}<small>${kb(d.size)}</small>${editable?`<button type="button" class="icon-btn" style="width:30px;height:30px" data-action="rm-doc" data-kind="${kind}" data-i="${i}" data-id="${p.id}" aria-label="Quitar documento"><span class="ms" style="font-size:18px">delete</span></button>`:""}</li>`).join("")||`<li style="color:var(--ink-3)">Sin documentos</li>`}</ul>${editable?`<label class="btn btn-outline btn-sm" style="align-self:flex-start;margin-top:6px"><span class="ms">upload_file</span>Subir documento<input type="file" hidden multiple accept=".pdf,image/*,.doc,.docx" data-upload="${kind}" data-id="${p.id}"></label>`:""}</div>`;
}
function reserveRO(p){
  const r = p.reserve;
  return `<div class="box"><h3><span class="ms">verified</span>Reserva</h3>
    <div class="progress"><i style="width:${r.progress||0}%"></i></div><small class="num">Avance ${r.progress||0}%</small>
    <dl class="kv" style="font-size:13px"><dt>Escribanía</dt><dd>${r.notary?"Aprobada":"Pendiente"}</dd><dt>Costos estimados</dt><dd>${usd(r.costs)}</dd><dt>Comisiones</dt><dd>${usd(r.commission)}</dd></dl>
    ${docsHTML(p,"res_signed",false)}${docsHTML(p,"res_receipt",false)}
    ${r.news.length?`<b style="font-size:13px">Novedades</b><ul class="log">${[...r.news].reverse().map(n=>`<li><small>${fmtDateShort(n.date)}</small><span>${esc(n.text)}</span></li>`).join("")}</ul>`:""}</div>`;
}
function deedRO(p){
  const d = deedOf(p);

    ${d.address?`<a class="btn btn-outline btn-sm" href="${mapsUrl(d.address)}" target="_blank" rel="noopener"><span class="ms">map</span>Ver en el mapa</a>`:""}</div>`;
}
function stageFields(p, st){
  const miss = stageMissing(p, st);
  const need = miss.length && st!==p.status ? `<div class="note" style="background:var(--amber-soft);margin-top:10px"><span class="ms" style="color:var(--amber)">info</span>Para pasar a «${STATUS[st].label}» falta: ${miss.join(", ")}.</div>` : "";

  }
  if (st==="negociacion"){
    return `${need}<div class="form" style="margin-top:10px">
      <p class="hint" style="margin:0">Oferta formal con el adelanto depositado.</p>
      <div class="field h"><label for="d-offer">Precio ofrecido (USD)</label><input id="d-offer" type="number" min="0" step="500" value="${p.offer.price??""}"></div>
      <div class="field h"><label for="d-dep">Adelanto depositado (USD)</label><input id="d-dep" type="number" min="0" step="100" value="${p.offer.deposit??""}"></div>
      <div class="field"><label for="d-counter">Contraoferta a responder (USD)</label><input id="d-counter" type="number" min="0" step="500" value="${p.nego.counter??""}"></div>
      ${docsHTML(p,"nego_receipt",true)}${docsHTML(p,"nego",true)}${docArr(p,"offer").length?docsHTML(p,"offer",true):""}
    </div>`;
  }
  if (st==="reservada"){
    const r = p.reserve;
    return `${need}<div class="form" style="margin-top:10px">
      ${docsHTML(p,"res_signed",true)}${docsHTML(p,"res_receipt",true)}
      <div class="field h"><label for="d-prog">Avance hasta la firma (%)</label><input id="d-prog" type="number" min="0" max="100" step="5" value="${r.progress||0}"></div>
      <div class="field h"><label for="d-costs">Costos estimados (USD)</label><input id="d-costs" type="number" min="0" value="${r.costs??""}"></div>
      <div class="field h"><label for="d-comm">Comisiones (USD)</label><input id="d-comm" type="number" min="0" value="${r.commission??""}"></div>
      <div class="field h"><label class="check" style="margin-top:28px"><input id="d-notary" type="checkbox" ${r.notary?"checked":""}> Escribanía aprobada</label></div>
      <div class="field"><label for="d-news">Nueva novedad</label><textarea id="d-news" placeholder="Ej.: Llegó el informe de dominio sin observaciones."></textarea></div>
      ${r.news.length?`<ul class="log">${[...r.news].reverse().map(n=>`<li><small>${fmtDateShort(n.date)}</small><span>${esc(n.text)}</span></li>`).join("")}</ul>`:""}
    </div>`;
  }
  if (st==="escritura"){
    const d = deedOf(p);
    return `${need}<div class="form" style="margin-top:10px">
      <div class="field h"><label for="d-deed-place">Escribanía o lugar <span class="req">obligatorio</span></label><input id="d-deed-place" value="${esc(d.place)}" placeholder="Ej.: Escribanía Pérez"></div>
      <div class="field h"><label for="d-deed-addr">Dirección</label><input id="d-deed-addr" value="${esc(d.address)}" placeholder="Av. Cabildo 2000, Belgrano"></div>

      <div class="field"><label for="d-deed-notes">Notas</label><textarea id="d-deed-notes" placeholder="Qué llevar, quiénes firman, etc.">${esc(d.notes)}</textarea></div>
      ${docArr(p,"res_signed").length||docArr(p,"res_receipt").length?`${docsHTML(p,"res_signed",true)}${docsHTML(p,"res_receipt",true)}`:""}
    </div>`;
  }
  if (st==="descartada") return `<div class="form" style="margin-top:10px"><div class="field"><label for="d-reason">Motivo</label><input id="d-reason" value="${esc(p.choiceNote||"")}" placeholder="Ej.: El propietario no aceptó la oferta"></div></div>`;
  return need;
}

function clientForm(c){
  const e = c || {name:"",email:"",slots:[{days:[1,2,3,4,5],from:"18:00",to:"20:00"}],notes:""};
  UI.tmpSlots = JSON.parse(JSON.stringify(e.slots && e.slots.length ? e.slots : [{days:[1,2,3,4,5],from:"18:00",to:"20:00"}]));
  openDlg(`<form class="dlg" data-form="client" data-id="${c?c.id:""}">
    ${head(c?(isStaff()?"Editar cliente":"Mis horarios"):"Agregar cliente")}
    <div class="dlg-body"><div class="form">
      <div class="field h"><label for="c-name">Nombre</label><input id="c-name" required value="${esc(e.name)}"></div>
      <div class="field h"><label for="c-email">Cuenta de Gmail</label><input id="c-email" type="email" value="${esc(e.email)}" placeholder="nombre@gmail.com"></div>
      <div class="field"><label>Preferencias de agenda</label><div id="slots" class="stack" style="gap:10px">${slotsHTML()}</div><button type="button" class="btn btn-text btn-sm" data-action="add-slot" style="align-self:flex-start;margin-top:4px"><span class="ms">add</span>Agregar franja</button></div>
      <div class="field"><label for="c-notes">Notas</label><textarea id="c-notes" placeholder="Qué busca, zonas, restricciones">${esc(e.notes||"")}</textarea></div>
    </div></div>
    <div class="dlg-foot"><button type="button" class="btn btn-text" data-action="close">Cancelar</button><button class="btn btn-filled" type="submit">Guardar</button></div>
  </form>`);
}
function slotsHTML(){
  return UI.tmpSlots.map((s,i)=>`<div class="slot-edit"><div class="daypick">${[1,2,3,4,5,6,0].map(d=>`<button type="button" data-action="slot-day" data-i="${i}" data-day="${d}" aria-pressed="${s.days.includes(d)}">${DAYS[d]}</button>`).join("")}</div>
    <div class="times"><label for="s-from-${i}" style="font-size:13px">De</label><input id="s-from-${i}" type="time" value="${s.from}" data-slot="${i}" data-k="from"><label for="s-to-${i}" style="font-size:13px">a</label><input id="s-to-${i}" type="time" value="${s.to}" data-slot="${i}" data-k="to"><button type="button" class="icon-btn" data-action="rm-slot" data-i="${i}" aria-label="Quitar franja" style="margin-left:auto"><span class="ms">delete</span></button></div></div>`).join("") || `<small style="color:var(--ink-3)">Sin franjas. Agregá al menos una.</small>`;
}
function textForm(kind, title, label, value, btn){
  openDlg(`<form class="dlg" data-form="${kind}">${head(title)}<div class="dlg-body"><div class="form"><div class="field"><label for="t-val">${label}</label><input id="t-val" required value="${esc(value)}" autofocus placeholder="Ej.: Compra Javier"></div></div></div><div class="dlg-foot"><button type="button" class="btn btn-text" data-action="close">Cancelar</button><button class="btn btn-filled" type="submit">${btn}</button></div></form>`);
}

/* ---------- menus ---------- */
let menuEl = null;
function closeMenu(){ if (menuEl){ menuEl.remove(); menuEl = null; } }
function openMenu(anchor, html){
  closeMenu();
  menuEl = document.createElement("div"); menuEl.className = "menu"; menuEl.setAttribute("role","menu"); menuEl.innerHTML = html;
  document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect();
  const w = menuEl.offsetWidth;
  menuEl.style.top = (r.bottom + 6) + "px";
  menuEl.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + "px";
}

/* ---------- actions ---------- */
function setView(v){ UI.view = v; UI.confirmDelete = null; if (v==="operacion") UI.team = null; if (v==="brokers") UI.admin = null; try { history.replaceState(null,"","#"+v); } catch(e){} render(); window.scrollTo(0,0); }
function commit(msg){ save(); render(); if (msg) snack(msg); }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-action]");
  if (menuEl && !e.target.closest(".menu") && !(t && /menu$/.test(t.dataset.action))) closeMenu();
  if (!t) return;
  const a = t.dataset.action, id = t.dataset.id;
  const o = op();
  switch(a){
    case "nav": setView(t.dataset.view); break;
    case "close": closeDlg(); break;
    case "pfilter": UI.propFilter = t.dataset.f; render(); break;
    case "open": { const p = prop(id); if (p){ closeMenu(); detailDlg(p); } break; }
    case "add-prop": propForm(null); break;
    case "edit-prop": propForm(prop(id)); break;
    case "del-prop": {
      if (UI.confirmDelete !== id){ UI.confirmDelete = id; t.classList.replace("btn-text","btn-danger"); t.textContent = "Confirmar eliminación"; break; }
      o.props = o.props.filter(p=>p.id!==id); o.visits = o.visits.filter(v=>v.propId!==id); renumber(); closeDlg(); commit("Propiedad eliminada"); break;
    }
    case "client-reject": {
      const v = o.visits.find(x=>x.id===id); const p = prop(v.propId);
      openDlg(`<form class="dlg" data-form="client-reject" data-id="${v.id}">${head("¿No podés ir a esta visita?")}<div class="dlg-body">
        <div class="vpick"><img referrerpolicy="no-referrer" src="${cover(p)}" alt=""><div><b>${esc(p.title)}</b><small>${fmtDateLong(v.date)} · ${v.time} · ${esc(v.address)}</small></div></div>
        <div class="form" style="margin-top:16px"><div class="field"><label for="cr-reason">Motivo o un horario que te quede mejor (opcional)</label><textarea id="cr-reason" autofocus placeholder="Ej.: Me surgió una reunión. ¿Puede ser el jueves a las 19?"></textarea></div></div>
        <p style="color:var(--ink-2);margin:12px 0 0;font-size:14px">Le vamos a avisar al broker y al asistente para que te propongan otro horario.</p>
      </div><div class="dlg-foot"><button type="button" class="btn btn-text" data-action="close">Volver</button><button class="btn btn-danger" type="submit"><span class="ms">event_busy</span>Rechazar visita</button></div></form>`);
      break;
    }
    case "notice-read": { const n = notices().find(x=>x.id===id); if (n){ n.seen = [...new Set([...(n.seen||[]), role()])]; } closeMenu(); commit(); break; }
    case "notice-open": { const n = notices().find(x=>x.id===id); closeMenu(); UI.view = "agenda"; if (n && n.visitId){ const v = o.visits.find(x=>x.id===n.visitId); if (v) UI.weekStart = ymd(weekMonday(parseYmd(v.date))); } try{history.replaceState(null,"","#agenda");}catch(e){} render(); break; }
    case "notif-menu": {
      if (menuEl){ closeMenu(); break; }
      const list = notices().slice(0,8), r = role();
      openMenu(t, `<div class="lbl">Avisos</div>${list.length?list.map(n=>`<button class="nitem ${(n.seen||[]).includes(r)?"":"unread"}" data-action="notice-open" data-id="${n.id}"><span class="ms" style="color:var(--red)">event_busy</span><span>${esc(n.text)}${n.reason?`<small>Motivo: ${esc(n.reason)}</small>`:""}<small>${fmtDateShort(n.date)}</small></span></button>`).join(""):`<div style="padding:8px 12px;color:var(--ink-3);font-size:14px">No hay avisos.</div>`}`);
      menuEl.style.maxWidth = "360px";
      const rr = t.getBoundingClientRect(); menuEl.style.left = Math.max(12, rr.right - menuEl.offsetWidth) + "px";
      break;
    }
    case "open-src": { const p = prop(id); if (p && p.url) window.open(p.url, "_blank", "noopener"); if (markRead(p)) commit(); break; }
    case "card-visit": {
      const p = prop(id);
      if (p.approval!=="aprobada"){ snack(isBroker() ? "Aprobá la propiedad primero para poder agendar la visita." : "El broker tiene que aprobar la propiedad antes de agendar."); break; }
      if (p.status==="descartada"){ snack("Está descartada. Volvé a ponerla en consideración para agendar."); break; }
      if (!wanted(p)){ snack("Todavía no se puede agendar: el cliente tiene que tocar «Quiero verla»."); break; }
      UI.confirmDelete = null; visitForm(null, id, true); break;
    }
    case "card-del": {
      const p = prop(id);
      const nv = o.visits.filter(v=>v.propId===id).length;
      openDlg(`<div class="dlg">${head("¿Eliminar esta propiedad?")}<div class="dlg-body"><div class="vpick"><img referrerpolicy="no-referrer" src="${cover(p)}" alt=""><div><b>${esc(p.title)}</b><small>${esc(addrOf(p))} · ${usd(p.price)}</small></div></div><p style="color:var(--ink-2);margin:14px 0 0">Se quita de la lista para todos, también para el cliente${nv?`, y se cancela${nv>1?"n sus "+nv+" visitas":" su visita"} en la agenda`:""}. No se puede deshacer.</p></div><div class="dlg-foot"><button class="btn btn-text" data-action="close">Cancelar</button><button class="btn btn-danger" data-action="card-del-ok" data-id="${id}"><span class="ms">delete</span>Eliminar</button></div></div>`);
      break;
    }
    case "card-del-ok": {
      const p = prop(id);
      o.props = o.props.filter(x=>x.id!==id); o.visits = o.visits.filter(v=>v.propId!==id); renumber();
      closeDlg(); commit("“"+p.title+"” eliminada de la lista"); break;
    }
    case "no-phone": snack("Falta el teléfono del anunciante. Cargalo con Editar datos."); break;
    case "parse-url": {
      const url = $("#f-url").value.trim();
      const info = parseListing(url);
      const f = $("#found");
      if (!info){ f.innerHTML = `<span style="color:var(--red)">Ese link no es válido. Copialo completo desde la barra del navegador.</span>`; break; }
      if (!PARSEABLE.includes(info.portal)){
        const src = info.portal || hostName(url);
        if (!$("#f-title").value) $("#f-title").value = "Aviso de " + src;
        fillProp(Object.assign({}, info, {title:null}));
        f.innerHTML = `<span class="ms" style="font-size:18px">link</span>${esc(src)} no se lee automáticamente: se guarda el link y, al tocar la tarjeta, se abre el aviso original. Si querés, completá a mano los datos que tengas.`;
        break;
      }
      fillProp(info);
      t.disabled = true; const label = t.innerHTML; t.innerHTML = `<span class="ms spin">progress_activity</span>Leyendo el aviso…`;
      f.innerHTML = `<span style="color:var(--ink-2)">Abriendo el aviso en ${esc(info.portal||"el portal")}…</span>`;
      const res = await readListing(url);
      t.disabled = false; t.innerHTML = label;
      if (!document.body.contains(f)) break;
      if (res.ok){
        UI.lastRead = res.data;
        const merged = Object.assign(parseText(res.data.text||""), res.data.fields||{});
        if (!merged.barrio && info.barrio) merged.barrio = info.barrio;
        fillProp(merged, true);
        const before = UI.tmpPhotos.length;
        (res.data.photos||[]).forEach(src => { if (!UI.tmpPhotos.includes(src)) UI.tmpPhotos.push(src); });
        $("#thumbs").innerHTML = thumbsHTML();
        const nPh = UI.tmpPhotos.length - before;
        const labels = {price:"precio",expensas:"expensas",m2:"m² totales",m2cub:"m² cubiertos",amb:"ambientes",banos:"baños",cocheras:"cocheras",piso:"piso",pisos:"pisos",balcon:"balcón",address:"dirección",barrio:"localidad",phone:"teléfono",title:"título"};
        const got = Object.keys(labels).filter(k=>merged[k]!=null && merged[k]!=="").map(k=>labels[k]);
        if (nPh) got.push(nPh + (nPh===1?" foto":" fotos"));
        const cur = res.data.fields && res.data.fields.currency && res.data.fields.currency!=="USD" ? ` El precio está en ${esc(res.data.fields.currency)} (${fmtNum(res.data.fields.priceOther)}): cargalo en dólares.` : "";
        const miss = ["price","expensas","phone"].filter(k=>merged[k]==null||merged[k]==="").map(k=>labels[k]);
        f.innerHTML = `<span class="ms" style="font-size:18px">check_circle</span>Leído de ${esc(res.data.portal||info.portal)}: ${got.join(", ")}.${cur}${miss.length?` Falta: ${miss.join(", ")}.`:""} Revisá los campos en verde. <button type="button" class="btn btn-text btn-sm" data-action="copy-diag" style="height:26px;padding:0 8px">¿Faltan datos? Copiar diagnóstico</button>`;
      } else if (res.reason === "no_server"){
        const got = [info.portal, info.amb && info.amb+" ambientes", info.barrio, info.m2 && info.m2+" m²"].filter(Boolean);
        f.innerHTML = `<span style="color:var(--amber)">${got.length?"Del link: "+got.map(esc).join(" · ")+". ":""}La lectura completa del aviso funciona en la versión publicada en Netlify. Acá pegá el texto del aviso abajo.</span>`;
        $("#f-text").focus();
      } else {
        f.innerHTML = `<span style="color:var(--amber)">${esc(res.message||"No se pudo leer el aviso.")} ${res.reason==="bloqueado"?"Abrí el aviso en tu navegador y usá el favorito «Enviar a Visitas», o pegá el texto abajo.":"Podés pegar el texto del aviso abajo."}</span>`;
        $("#f-text").focus();
      }
      break;
    }
    case "copy-diag": {
      const d = UI.lastRead || {};
      const diag = JSON.stringify({ url: d.url, portal: d.portal, source: d.source, fields: d.fields, photos: (d.photos||[]).slice(0,5), nPhotos: (d.photos||[]).length, text: String(d.text||"").slice(0, 3000) }, null, 1);
      try { await navigator.clipboard.writeText(diag); snack("Diagnóstico copiado. Pegalo en el chat con Claude."); } catch(err){ snack("No se pudo copiar el diagnóstico."); }
      break;
    }
    case "bookmarklet": bookmarkletDlg(); break;
    case "bm-copy": try { await navigator.clipboard.writeText(bookmarkletHref()); snack("Código del favorito copiado"); } catch(err){ snack("No se pudo copiar. Usá la opción de arrastrar."); } break;
    case "parse-text": {
      const txt = $("#f-text").value;
      const f = $("#found-text");
      if (txt.trim().length < 20){ f.innerHTML = `<span style="color:var(--amber)">Primero pegá el texto del aviso.</span>`; $("#f-text").focus(); break; }
      const info = parseText(txt);
      const n = fillProp(info, true);
      const labels = {price:"precio",expensas:"expensas",m2:"m² totales",m2cub:"m² cubiertos",amb:"ambientes",banos:"baños",cocheras:"cocheras",piso:"piso",pisos:"pisos",balcon:"balcón",address:"dirección",barrio:"localidad",phone:"teléfono",title:"título"};
      const got = Object.keys(labels).filter(k=>info[k]!=null && info[k]!=="").map(k=>labels[k]);
      f.innerHTML = got.length ? `<span class="ms" style="font-size:18px">check_circle</span>Completado: ${got.join(", ")}.` : `<span style="color:var(--amber)">No encontramos datos en ese texto. Revisá que hayas copiado la página del aviso.</span>`;
      break;
    }
    case "rm-photo": UI.tmpPhotos.splice(+t.dataset.i,1); $("#thumbs").innerHTML = thumbsHTML(); break;
    case "approve": { const p = prop(id); p.approval = "aprobada"; logp(p,"Aprobada por Broker"); if (dlg.open) detailDlg(p); commit("Aprobada: "+ clientLabel() +" ya la puede ver"); break; }
    case "unapprove": {
      const p = prop(id); p.approval = "rechazada"; logp(p,"Desaprobada por Broker: el cliente ya no la ve");
      const hasVisits = o.visits.some(v=>v.propId===id && v.state!=="rechazada" && parseYmd(v.date)>=today());
      if (dlg.open) detailDlg(p);
      commit("Desaprobada: el cliente ya no la ve. Sigue en la lista como No aprobada" + (hasVisits ? ". Ojo: tiene visitas agendadas" : ""));
      break;
    }
    case "reject": { const p = prop(id); p.approval = "rechazada"; logp(p,"No aprobada por Broker"); if (dlg.open) detailDlg(p); commit("Propiedad marcada como no aprobada"); break; }
    case "want": { const p = prop(id); const n = ranked().length+1; p.status = "para_agendar"; p.rank = n; logp(p,`${S.session.name} la marcó para visitar (prioridad ${n})`); if (dlg.open) closeDlg(); commit("Lista para agendar. Quedó en tu ranking en el puesto "+n); break; }
    case "discard": {
      const p = prop(id);
      openDlg(`<form class="dlg" data-form="discard" data-id="${p.id}">${head("¿Descartar esta propiedad?")}<div class="dlg-body">
        <div class="vpick"><img referrerpolicy="no-referrer" src="${cover(p)}" alt=""><div><b>${esc(p.title)}</b><small>${esc(addrOf(p))} · ${usd(p.price)}</small></div></div>
        <div class="form" style="margin-top:16px"><div class="field"><label for="ds-reason">¿Por qué? (opcional, ayuda a tu broker a buscar mejor)</label><input id="ds-reason" autofocus placeholder="Ej.: Queda lejos del trabajo"></div></div>
        <p style="color:var(--ink-2);margin:12px 0 0;font-size:14px">No se borra: pasa a <b>Descartadas</b> y la podés volver a considerar cuando quieras.</p>
      </div><div class="dlg-foot"><button type="button" class="btn btn-text" data-action="close">Cancelar</button><button class="btn btn-filled" type="submit">Descartar</button></div></form>`);
      break;
    }
    case "ctab": UI.clientTab = t.dataset.k; render(); break;
    case "restore": { const p = prop(id); p.status = "nueva"; p.choiceNote = ""; logp(p,`${S.session.name} la vuelve a considerar`); if (dlg.open) closeDlg(); if (!isStaff()) UI.clientTab = "revisar"; commit("Volvió a Para revisar"); break; }
    case "rank-up": case "rank-down": {
      const list = ranked(); const i = list.findIndex(p=>p.id===id); const j = a==="rank-up"? i-1 : i+1;
      if (j<0 || j>=list.length) break;
      [list[i].rank, list[j].rank] = [list[j].rank, list[i].rank];
      logp(list[i], `Prioridad cambiada a #${list[i].rank}`);
      commit(); break;
    }
    case "save-stage": {
      const p = prop(id); const st = $("#d-status").value; const prev = p.status;
      const num = sel => { const el = $(sel); return el && el.value!=="" ? Number(el.value) : ""; };
      const v2 = sel => { const el = $(sel); return el ? el.value.trim() : ""; };
      if (st==="oferta"||st==="negociacion"){ p.offer.price = num("#d-offer"); p.offer.deposit = num("#d-dep"); }
      if (st==="negociacion"){ p.nego.counter = num("#d-counter"); }
      if (st==="reservada"){
        p.reserve.progress = Math.min(100,Math.max(0,num("#d-prog")||0)); p.reserve.costs = num("#d-costs"); p.reserve.commission = num("#d-comm"); p.reserve.notary = $("#d-notary").checked;
        const n = $("#d-news").value.trim(); if (n){ p.reserve.news.push({date:nowStamp(),text:n}); }
      }
      if (st==="escritura"){ Object.assign(deedOf(p), { place:v2("#d-deed-place"), address:v2("#d-deed-addr"), date:v2("#d-deed-date"), time:v2("#d-deed-time"), notes:v2("#d-deed-notes") }); }
      const miss = st!==prev ? stageMissing(p, st) : [];
      if (miss.length){ save(); const box = $("#stage-fields"); if (box) box.innerHTML = stageFields(p, st); snack("Para pasar a «"+STATUS[st].label+"» falta: "+miss.join(", ")+"."); break; }
      if (st==="descartada"){ p.choiceNote = $("#d-reason").value.trim(); p.rank = null; }
      if (st!==prev){
        p.status = st;
        if (!["nueva","leida","descartada"].includes(st) && p.rank==null) p.rank = ranked().length+1;
        if (st==="nueva" || st==="leida") p.rank = null;
        let txt = "Estado: "+STATUS[st].label;
        if (st==="oferta" && p.offer.price) txt += ` · USD ${fmtNum(p.offer.price)}${p.offer.deposit?" con USD "+fmtNum(p.offer.deposit)+" de depósito":""}`;
        if (st==="negociacion" && p.nego.counter) txt += ` · contraoferta USD ${fmtNum(p.nego.counter)}`;
        if (st==="descartada" && p.choiceNote) txt += ` · ${p.choiceNote}`;
        if (st==="escritura"){ const d = deedOf(p); txt += ` · ${fmtDateShort(d.date)}${d.time?" "+d.time:""} en ${d.place||d.address}`; }
        logp(p, txt);
      } else logp(p, "Datos de "+STATUS[st].label.toLowerCase()+" actualizados");
      renumber(); closeDlg(); commit("Estado guardado"); break;
    }
    case "open-doc": {
      const url = t.dataset.url;
      if (!/^\/api\//.test(url)) { snack("Este documento solo quedó registrado por nombre."); break; }
      const w = window.open("", "_blank");
      try { const r = await fetch(url, { headers: SRV.token ? { authorization: "Bearer " + SRV.token } : {} }); if (!r.ok) throw new Error((await r.json().catch(()=>({}))).message || "No se pudo abrir el documento."); const bl = await r.blob(); const u = URL.createObjectURL(bl); if (w) w.location = u; else window.open(u, "_blank"); }
      catch(err){ if (w) w.close(); snack(err.message); }
      break;
    }
    case "rm-doc": { const p = prop(id); const k = t.dataset.kind; const rem = docArr(p,k).splice(+t.dataset.i,1)[0]; if (rem) logp(p, "Documento quitado: "+rem.name); save(); const st = $("#d-status")?.value; detailDlg(p); if (st && $("#d-status")) { $("#d-status").value = st; $("#stage-fields").innerHTML = stageFields(p, st); } break; }
    case "add-visit": visitForm(null, id); break;
    case "edit-visit": { if (t.dataset.notice){ const n = notices().find(x=>x.id===t.dataset.notice); if (n) n.seen = [...new Set([...(n.seen||[]), role()])]; save(); } visitForm(o.visits.find(v=>v.id===id)); break; }
    case "open-visit": visitDetail(o.visits.find(v=>v.id===id)); break;
    case "del-visit": {
      if (UI.confirmDelete !== id){ UI.confirmDelete = id; t.classList.replace("btn-text","btn-danger"); t.textContent = "Confirmar cancelación"; break; }
      const v = o.visits.find(x=>x.id===id); const p = prop(v.propId);
      o.visits = o.visits.filter(x=>x.id!==id);
      if (p.status==="por_visitar" && !o.visits.some(x=>x.propId===p.id && x.state==="confirmada")) p.status = "para_agendar";
      logp(p,`Visita del ${fmtDateShort(v.date)} cancelada`); closeDlg(); commit("Visita cancelada"); break;
    }
    case "confirm-visit": {
      const v = o.visits.find(x=>x.id===id); const p = prop(v.propId);
      v.state = "confirmada"; if (["nueva","leida","para_agendar"].includes(p.status)){ p.status = "por_visitar"; if (p.rank==null) p.rank = ranked().length+1; }
      logp(p, `Visita confirmada: ${fmtDateShort(v.date)} ${v.time}`); if (dlg.open) closeDlg(); commit("Visita confirmada. El cliente ya la ve en su agenda"); break;
    }
    case "reject-visit": {
      const v = o.visits.find(x=>x.id===id); v.state = "rechazada"; logp(prop(v.propId), `Broker no puede el ${fmtDateShort(v.date)} ${v.time}`); if (dlg.open) closeDlg(); commit("Visita rechazada. El asistente puede proponer otro horario"); break;
    }
    case "result": resultForm(o.visits.find(v=>v.id===id)); break;
    case "rate": UI.visitRating = t.dataset.k; dlg.querySelectorAll("[data-action=rate]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===UI.visitRating)); break;
    case "week": {
      UI.weekStart = t.dataset.d==="0" ? ymd(weekMonday(today())) : ymd(addDays(parseYmd(UI.weekStart), +t.dataset.d));

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.actionChange === "stage-preview"){ $("#stage-fields").innerHTML = stageFields(prop(dlg.querySelector("[data-action=save-stage]").dataset.id), t.value); return; }
  if (t.dataset.actionChange === "visit-prop"){ const p = prop(t.value); const addr = (p.address||"")+(p.barrio?", "+p.barrio:""); $("#v-addr").value = addr; $("#v-map").href = mapsUrl(addr); visitCheck(); return; }
  if (t.dataset.actionChange === "visit-check"){ visitCheck(); return; }
  if (t.dataset.assign){
    const email = t.dataset.assign;
    const opIds = [...document.querySelectorAll(`input[data-assign="${CSS.escape(email)}"]:checked`)].map(x=>x.value);
    try { await api(`/env/${encodeURIComponent(S.session.envId)}/members/${encodeURIComponent(email)}`, {method:"PUT", body:{opIds}}); snack("Operaciones asignadas"); const m = UI.team.members.find(x=>x.email===email); if (m) m.opIds = opIds; }
    catch(err){ snack(err.message); t.checked = !t.checked; }
    return;
  }
  if (t.dataset.slot != null){ UI.tmpSlots[+t.dataset.slot][t.dataset.k] = t.value; return; }
  const up = t.dataset.upload;
  if (!up || !t.files) return;
  if (up === "photos"){
    const files = [...t.files].slice(0, 12);
    for (const f of files){
      try {
        const d = await resizeImage(f);
        if (UI.server === true){ $("#thumbs").insertAdjacentHTML("afterbegin", `<span class="found" id="up-msg">Subiendo foto…</span>`); UI.tmpPhotos.push(await uploadPhoto(d)); $("#up-msg")?.remove(); }
        else UI.tmpPhotos.push(d);
      } catch(err){ $("#up-msg")?.remove(); snack(err && err.message ? err.message : "No se pudo subir "+f.name); }
    }
    $("#thumbs").innerHTML = thumbsHTML(); return;
  }
  if (DOC_KINDS.includes(up)){
    const p = prop(t.dataset.id);
    const arr = docArr(p, up);
    const files = [...t.files]; const ok = [];
    const lbl = t.closest("label"); if (lbl) lbl.insertAdjacentHTML("afterend", `<span class="found" id="doc-msg">Subiendo…</span>`);
    for (const f of files){
      try {
        if (UI.server === true){
          if (f.size > 5*1024*1024) throw new Error(f.name + " pesa más de 5 MB.");
          const r = await api(`/env/${encodeURIComponent(S.session.envId)}/docs/${encodeURIComponent(op().id)}`, { method:"POST", body:f, headers:{ "content-type": f.type || "application/pdf", "x-filename": encodeURIComponent(f.name) } });
          arr.push({ name:r.name || f.name, size:r.size || f.size, url:r.url, at:nowStamp() });
        } else arr.push({ name:f.name, size:f.size, at:nowStamp() });
        ok.push(f.name);
      } catch(err){ snack(err.message); }
    }
    $("#doc-msg")?.remove();
    if (ok.length){ logp(p, `${DOC_INFO[up].label}: ${ok.join(", ")}`); save(); snack(ok.length===1 ? "Documento subido" : ok.length+" documentos subidos"); }
    const st = $("#d-status") ? $("#d-status").value : p.status;
    if ($("#stage-fields")) $("#stage-fields").innerHTML = stageFields(p, st);
  }
});

const SRV_KEY = "visitas-srv-v1";
// Cada pestaña guarda su propia sesión: se puede tener el superusuario en una pestaña y otra cuenta en otra
// sin que una pise a la otra. Una pestaña nueva arranca con la última sesión usada.
let SRV = (() => { try { return JSON.parse(sessionStorage.getItem(SRV_KEY) || localStorage.getItem(SRV_KEY)) || {}; } catch(e){ return {}; } })();
function saveSrv(){ const v = JSON.stringify(SRV); try { sessionStorage.setItem(SRV_KEY, v); } catch(e){} try { if (SRV.token) localStorage.setItem(SRV_KEY, v); } catch(e){} }

class ApiError extends Error { constructor(status, data){ super(((data && data.message) || "No se pudo conectar con el servidor.") + (data && data.detail ? " Detalle técnico: " + data.detail : "")); this.status = status; this.data = data || {}; } }
async function api(path, opts = {}){
  const headers = Object.assign({}, opts.headers || {});
  if (SRV.token) headers.authorization = "Bearer " + SRV.token;
  let body = opts.body;
  if (body && !(body instanceof Blob) && typeof body !== "string"){ body = JSON.stringify(body); headers["content-type"] = "application/json"; }
  let r;
  try { r = await fetch("/api" + path, { method: opts.method || "GET", headers, body }); }
  catch(e){ throw new ApiError(0, {message:"Sin conexión. Revisá internet y probá de nuevo."}); }
  let data = null; try { data = await r.json(); } catch(e){}
  if (!r.ok){
    if (r.status === 401 && path !== "/session"){ srvLogout(true); }
    throw new ApiError(r.status, data);
  }
  return data;
}

async function detectServer(){
  if (!/^https?:$/.test(location.protocol)){ UI.server = false; UI.booting = false; render(); return; }
  let cfg = null;
  try {
    const r = await fetch("/api/config", {signal: AbortSignal.timeout(6000)});
    if ((r.headers.get("content-type")||"").includes("json")) cfg = await r.json();
  } catch(e){}
  UI.booting = false;
  if (!cfg || !cfg.server){ UI.server = false; render(); return; }
  UI.server = true; UI.cfg = cfg;
  S = { session:null, currentOp:null, ops:[] };
  UI.view = NAV.some(n=>n.id===UI.view) ? UI.view : "propiedades";
  const params = new URLSearchParams(location.search);
  const inv = params.get("invite");
  if (inv){ UI.inviteToken = inv; try { UI.inviteInfo = (await api("/invites/" + encodeURIComponent(inv))).invite; } catch(e){ UI.inviteError = e.message; } }
  if (SRV.token) { await bootServer(); } else render();
}
