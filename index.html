async function bootServer(){
  try {
    if (UI.inviteToken && UI.inviteInfo && !UI.inviteConsent && UI.inviteInfo.status === "pendiente"){
      // Ya había una sesión abierta: no se acepta sola. Se pregunta (después de entrar) si la invitación es para esta cuenta.
      UI.pendingInvite = { token: UI.inviteToken, info: UI.inviteInfo };
      UI.inviteToken = null; UI.inviteInfo = null;
      try { history.replaceState(null, "", location.pathname + location.hash); } catch(e){}
    }
    if (UI.inviteToken && UI.inviteInfo && (UI.inviteInfo.status === "pendiente" || UI.inviteInfo.status === "usada")){
      try {
        const r = await api(`/invites/${encodeURIComponent(UI.inviteToken)}/accept`, { method:"POST" });
        SRV.envId = r.envId; if (r.opId) SRV.opId = r.opId; saveSrv();
        UI.welcome = r.already ? null : r.role;
      } catch(e){ snack(e.message); }
      UI.inviteToken = null; UI.inviteInfo = null; UI.inviteConsent = false;
      try { history.replaceState(null, "", location.pathname + location.hash); } catch(e){}
    }
    const me = await api("/me");
    UI.me = me;
    const base = { name: me.user.name, email: me.user.email, super: !!me.user.super, superName: me.user.name };
    if (me.user.super && !SRV.envId){ S.session = Object.assign({ role:"broker" }, base); S.ops = []; UI.env = null; UI.view = "brokers"; render(); return; }
    let envId = SRV.envId && (me.user.super || me.envs.some(e=>e.envId===SRV.envId)) ? SRV.envId : (me.envs[0] && me.envs[0].envId);
    if (!envId){
      if (me.user.super){ S.session = Object.assign({ role:"broker" }, base); UI.view = "brokers"; render(); return; }
      S.session = Object.assign({ role:"cliente", noAccess:true }, base); render(); return;
    }
    S.session = Object.assign({ role:"cliente" }, base);
    // Si un ambiente no carga, se prueba con los otros; nunca se cierra la sesión por eso.
    const tryIds = [envId, ...me.envs.map(e=>e.envId).filter(x=>x!==envId)];
    let loaded = false, lastErr = null;
    for (const id of tryIds){
      try { await loadEnv(id); loaded = true; break; }
      catch(err){ if (err.status === 401) throw err; lastErr = err; SRV.envId = null; saveSrv(); }
    }
    if (!loaded){
      if (me.user.super){ S.session = Object.assign({ role:"broker" }, base); S.ops = []; UI.env = null; UI.view = "brokers"; render(); snack("No se pudo abrir el ambiente: " + lastErr.message); return; }
      S.session = Object.assign({ role:"cliente", loadError: lastErr ? lastErr.message : "No se pudo abrir el ambiente." }, base); render(); return;
    }
    if (lastErr) snack("Uno de tus ambientes no se pudo abrir: " + lastErr.message);
    if (UI.welcome){ snack(UI.welcome==="broker" ? "¡Listo! Ya tenés tu ambiente. Creá tu primera operación." : UI.welcome==="broker_env" ? "¡Listo! Ya sos broker en " + (UI.env ? UI.env.name : "el ambiente") : UI.welcome==="asistente" ? "¡Listo! Ya sos asistente en " + (UI.env ? UI.env.name : "el ambiente") : "¡Listo! Ya podés ver las propiedades de tu búsqueda."); UI.welcome = null; }
  } catch(e){
    if (e.status !== 401){ S.session = null; render(); const m = document.getElementById("gsi-msg"); if (m) m.textContent = e.message; else snack(e.message); }
  }
  if (UI.pendingInvite) setTimeout(askPendingInvite, 300);
}
async function loadEnv(envId, keepRole){
  const d = await api(`/env/${encodeURIComponent(envId)}`);
  UI.env = d.env; UI.envRole = d.role; UI.team = null;
  S.ops = d.ops.map(migrateOp);
  SYNC.snap = {}; d.ops.forEach(o => SYNC.snap[o.id] = snapOf(o));
  const colab = d.role === "colaborador";
  const role = (S.session.super && keepRole) ? S.session.role : (colab ? "broker" : d.role);
  S.session = Object.assign({}, S.session, { role, colab, envId, noAccess:false });
  S.currentOp = d.ops.some(o=>o.id===SRV.opId) ? SRV.opId : (d.ops[0] && d.ops[0].id) || null;
  SRV.envId = envId; SRV.opId = S.currentOp; saveSrv();
  if (UI.view === "brokers") UI.view = "propiedades";
  render(); maybeAskPrefs(); startPolling();
}

  openDlg(`<div class="dlg">${head("¿Esta invitación es para vos?")}<div class="dlg-body">

/* ---------- sincronización ---------- */
function snapOf(o){ const c = Object.assign({}, o); delete c._v; delete c.updatedAt; delete c.updatedBy; return JSON.stringify(c); }
function syncLabel(){ return SYNC.state === "saving" ? '<span class="ms spin" style="font-size:16px">progress_activity</span>Guardando' : SYNC.state === "error" ? '<span class="ms" style="font-size:16px">cloud_off</span>Sin guardar' : '<span class="ms" style="font-size:16px">cloud_done</span>Guardado'; }
function setSync(st){ SYNC.state = st; const el = document.getElementById("sync"); if (el){ el.innerHTML = syncLabel(); el.dataset.state = st; } }
function dirtyOps(){ return S.ops.filter(o => SYNC.snap[o.id] !== snapOf(o)); }
function scheduleSync(){ setSync("saving"); clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncNow, 350); }
async function syncNow(){
  if (SYNC.busy){ SYNC.again = true; return; }
  if (!S.session || !S.session.envId){ setSync(dirtyOps().length ? "error" : "ok"); return; }
  SYNC.busy = true; let failed = false, needRender = false;
  try {
    for (const o of dirtyOps()){
      const sent = snapOf(o);
      try {
        const r = await api(`/env/${encodeURIComponent(S.session.envId)}/ops/${encodeURIComponent(o.id)}`, { method:"PUT", body:{ op:o, baseV:o._v || 0 } });
        const i = S.ops.findIndex(x=>x.id===o.id); if (i < 0) continue;
        if (snapOf(S.ops[i]) === sent){
          if (snapOf(r.op) !== sent) needRender = true;
          S.ops[i] = r.op; SYNC.snap[o.id] = snapOf(r.op);
        } else { S.ops[i]._v = r.op._v; SYNC.snap[o.id] = sent; SYNC.again = true; }
      } catch(e){
        if (e.status === 409 && e.data.op){
          migrateOp(e.data.op); const i = S.ops.findIndex(x=>x.id===o.id); if (i >= 0) S.ops[i] = e.data.op;
          SYNC.snap[o.id] = snapOf(e.data.op); needRender = true; snack(e.message);
        } else if (e.status === 403 || e.status === 400 || e.status === 413){
          snack(e.message); failed = true; await refreshEnv(true);
        } else { failed = true; if (e.status) snack(e.message); }
      }
    }
  } finally {
    SYNC.busy = false;
    setSync(failed ? "error" : dirtyOps().length ? "saving" : "ok");
    if (needRender) render();
    if (SYNC.again){ SYNC.again = false; scheduleSync(); }
    else if (failed){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncNow, 8000); }
  }
}
async function refreshEnv(force){
  if (!S.session || !S.session.envId || SYNC.busy) return;
  if (!force && dirtyOps().length) return;
  let d; try { d = await api(`/env/${encodeURIComponent(S.session.envId)}`); } catch(e){ return; }
  let changed = false;
  const ids = new Set(d.ops.map(o=>o.id));
  for (const so of d.ops){
    migrateOp(so);
    const i = S.ops.findIndex(x=>x.id===so.id);
    const dirty = i >= 0 && SYNC.snap[so.id] !== snapOf(S.ops[i]);
    if (i < 0){ S.ops.push(so); SYNC.snap[so.id] = snapOf(so); changed = true; }
    else if ((S.ops[i]._v||0) !== (so._v||0) && (!dirty || force)){ S.ops[i] = so; SYNC.snap[so.id] = snapOf(so); changed = true; }
  }
  const before = S.ops.length; S.ops = S.ops.filter(o => ids.has(o.id) || SYNC.snap[o.id] === undefined); if (S.ops.length !== before) changed = true;
  if (!op() && S.ops[0]) S.currentOp = S.ops[0].id;
  if (changed && !(dlg.open && dlg.querySelector("form"))) render();
}
function startPolling(){
  clearInterval(SYNC.poll);
  SYNC.poll = setInterval(() => { if (document.visibilityState === "visible") refreshEnv(false); }, 20000);
}
document.addEventListener("visibilitychange", () => { if (UI.server === true && document.visibilityState === "visible") refreshEnv(false); });

  <div class="page-head"><div><h1>Brokers</h1><div class="sub">Cada broker tiene su propio ambiente, donde administra asistentes, clientes y operaciones.</div></div>
    <div class="actions"><button class="btn btn-outline" data-action="new-env"><span class="ms">add_business</span>Nuevo ambiente</button><button class="btn btn-filled" data-action="invite" data-kind="broker"><span class="ms">person_add</span>Invitar broker</button></div></div>
  ${A.error ? `<div class="note" style="background:var(--red-soft)"><span class="ms" style="color:var(--red)">error</span>${esc(A.error)}</div>` : ""}
  <div class="summary">
    <div class="stat"><b>${A.envs.length}</b><span>Ambientes</span></div>
    <div class="stat"><b>${A.envs.filter(e=>e.active).length}</b><span>Activos</span></div>
    <div class="stat ${A.invites.length?"alert":""}"><b>${A.invites.length}</b><span>Invitaciones pendientes</span></div>
    <div class="stat"><b>${A.envs.reduce((n,e)=>n+e.ops,0)}</b><span>Operaciones en total</span></div>
  </div>
  ${A.invites.length ? `<div class="section-title" style="margin-top:0"><h2>Invitaciones pendientes</h2></div><div class="stack" style="margin-bottom:22px">${A.invites.map(i=>`<div class="panel" style="display:flex;gap:12px;align-items:center;padding:14px 18px"><span class="avatar av-broker" style="opacity:.6"><span class="ms" style="font-size:18px">schedule_send</span></span><div style="flex:1;min-width:0"><b>${esc(i.name||"Sin nombre")}</b> · ${esc(i.envName)}<br><small style="color:var(--ink-3)">Vence el ${fmtD(i.expires)}</small></div><button class="btn btn-tonal btn-sm" data-action="copy-text" data-text="${esc(inviteUrl(i.token))}"><span class="ms">content_copy</span>Copiar link</button><button class="btn btn-text btn-sm" data-action="revoke-invite" data-id="${esc(i.token)}">Anular</button></div>`).join("")}</div>` : ""}
  <div class="section-title" style="margin-top:0"><h2>Ambientes</h2><span class="count num">${A.envs.length}</span></div>
  ${A.loading ? '<div class="empty">Cargando…</div>' : A.envs.length ? `<div class="grid">${A.envs.map(e=>`<article class="panel env-card ${e.active?"":"off"}">
      <div style="display:flex;gap:10px;align-items:center"><span class="avatar av-broker">${esc(initials(e.brokerName))}</span><div style="min-width:0"><h3>${esc(e.name)}</h3><small style="color:var(--ink-3)">${(e.brokers && e.brokers.length ? e.brokers.map(x=>esc(x.name)).join(", ") : esc(e.brokerName))}</small></div></div>
      <dl class="kv" style="margin:12px 0;font-size:13px"><dt>Operaciones</dt><dd>${e.ops}</dd><dt>Asistentes</dt><dd>${e.asistentes}</dd><dt>Clientes</dt><dd>${e.clientes}</dd>${e.colaboradores?`<dt>Brokers invitados</dt><dd>${e.colaboradores}</dd>`:""}<dt>Desde</dt><dd>${fmtD(e.created)}</dd></dl>
      ${e.active ? "" : '<span class="status s-rechazada" style="margin-bottom:10px">Desactivado</span>'}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-filled btn-sm" data-action="enter-env" data-id="${e.id}"><span class="ms">login</span>Entrar</button><button class="btn btn-text btn-sm" data-action="toggle-env" data-id="${e.id}" data-active="${e.active}">${e.active ? "Desactivar" : "Activar"}</button></div>
    </article>`).join("")}</div>` : `<div class="empty"><span class="ms">apartment</span>Todavía no hay brokers. Invitá al primero.</div>`}`;
}

})();
</script>
</body>
</html>
